[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "brain2speech-net"
version = "2.0.0"
description = "Brain2Speech-Net: fast and intelligible brain-to-speech synthesis without text decoding"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["torch>=1.13", "numpy", "scipy", "scikit-learn", "pyyaml", "tqdm"]

[project.optional-dependencies]
text = ["g2p_en", "phonemizer", "Unidecode"]
eval = ["openai-whisper", "transformers", "torchaudio", "librosa", "pyworld", "pysptk", "fastdtw"]

[tool.setuptools.packages.find]
include = ["brain2speech_net*"]

[tool.setuptools.package-data]
brain2speech_net = ["vits/configs/*.json", "vits/LICENSE", "vits/text/LICENSE"]
