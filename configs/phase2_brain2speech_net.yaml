# Phase 2: deep-HMM alignment to VITS CPRs with joint fine-tuning of the brain content encoder.
# Values are those of the training run behind the paper's reported numbers and the released
# checkpoint (it stopped after 285 of the 1000 scheduled epochs: epoch_0285.pt here).

data:
  train: data/train.npz       # the 8,800 utterances of the official training split
  val_from_train: 80          # seeded permutation: first 8,720 train, last 80 validation (monitoring only)
  split_seed: 42
  val: data/test.npz          # used for monitoring only when val_from_train is 0

encoder_init: checkpoints/phase1/content_encoder.pt   # Phase 1 output

aligner:
  d_frame: 256                # brain frame embedding d_f
  d_cpr: 192                  # VITS text-encoder width
  d_emit: 192                 # emission space d_state
  d_state_emb: 128            # state embeddings v_k
  max_states: 512             # K_max: size of the state / prototype tables
  max_segments: null          # segment count classes; null = longest CPR sequence in train + val
  clamp_eps: 1.0e-3           # transition probability floor

prototypes:
  kmeans_init: true           # P initialised by k-means on {W_tgt z_k} (k = K_max)
  n_init: 10                  # k-means restarts
  recluster_every: 5          # epochs, after that epoch's checkpoints; also once after training. 0 disables
  max_points: null            # optional random subsample of CPR segments for k-means (null = all)

train:
  epochs: 1000
  batch_size: 32
  lr: 1.0e-3                  # aligner, PPSP, segment count predictor, CTC head
  encoder_lr: 1.0e-5          # brain content encoder fine-tuning
  warmup_steps: 500           # linear warm-up, then cosine decay to 0
  lambda_ctc: 0.3             # value used for the released model (the paper text states 0.1)
  grad_clip: 1.0
  amp_bf16: true              # bf16 autocast on CUDA (the HMM recursion always runs in fp32)
  num_workers: 2
  seed: 42
  log_every: 50
  val_every: 5                # epochs
  save_every: 5               # epochs (last.pt is written every epoch)

output_dir: checkpoints/phase2
